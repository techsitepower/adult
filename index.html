<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamFlow PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body { margin:0; font-family:Roboto; background:#0f0f0f; color:#fff; }

header{
  position:fixed; top:0; width:100%; height:60px;
  background:#0f0f0f; display:flex; align-items:center;
  padding:0 15px; gap:10px; z-index:10;
}

.logo{font-weight:700}

input{
  flex:1; padding:8px 12px; border-radius:6px;
  border:none; outline:none;
}

.main{ margin-top:80px; padding:20px; }

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:15px;
}

.card{
  background:#1a1a1a; border-radius:10px;
  overflow:hidden; cursor:pointer;
}

.card img{ width:100%; display:block; }

.card .info{ padding:10px; }

.title{ font-size:14px; margin-bottom:5px; }

.stats{ font-size:12px; color:#aaa; }

button{
  margin-top:8px;
  padding:6px 10px;
  border:none;
  background:#cc0000;
  color:white;
  cursor:pointer;
  border-radius:5px;
}

/* modal */
.modal{
  position:fixed; inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  width:90%; max-width:800px;
  background:#000; padding:15px;
}

.close{ float:right; cursor:pointer; }
</style>
</head>

<body>

<header>
<div class="logo">StreamFlow</div>
<input id="search" placeholder="Search movies..." />
</header>

<div class="main">
<div class="grid" id="grid"></div>
</div>

<!-- modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="close" onclick="closeModal()">✖</div>
    <h3 id="mTitle"></h3>
    <p id="mInfo"></p>
    <a id="watchBtn" target="_blank">
      <button>Watch Now</button>
    </a>
  </div>
</div>

<script>
// ===== CONFIG =====
// যদি Cloudflare Worker ব্যবহার করো তাহলে এটা বসাও
const API_BASE = "https://api.themoviedb.org/3"; 
const API_KEY = "PUT_YOUR_KEY_HERE"; // বা worker endpoint use করতে পারো

// ===== MANUAL WATCH LINKS =====
const watchLinks = {
  550: "https://your-link.com/fightclub",
  299536: "https://your-link.com/avengers"
};

function getWatchLink(id){
  return watchLinks[id] || "#";
}

// ===== TMDB SEARCH =====
async function searchMovies(q){
  const res = await fetch(
    `${API_BASE}/search/movie?query=${q}&api_key=${API_KEY}`
  );
  return await res.json();
}

// ===== RENDER =====
function render(movies){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  movies.forEach(m => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="https://image.tmdb.org/t/p/w500${m.poster_path}">
      <div class="info">
        <div class="title">${m.title}</div>
        <div class="stats">⭐ ${m.vote_average}</div>
        <button>Watch</button>
      </div>
    `;

    div.onclick = () => openModal(m);

    grid.appendChild(div);
  });
}

// ===== MODAL =====
function openModal(m){
  document.getElementById("modal").style.display="flex";
  document.getElementById("mTitle").innerText = m.title;
  document.getElementById("mInfo").innerText = m.overview;

  document.getElementById("watchBtn").href = getWatchLink(m.id);
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

// ===== SEARCH =====
document.getElementById("search").addEventListener("keyup", async (e)=>{
  if(e.key === "Enter"){
    const data = await searchMovies(e.target.value);
    render(data.results || []);
  }
});

// default load
searchMovies("avengers").then(d => render(d.results));

</script>

</body>
</html>
