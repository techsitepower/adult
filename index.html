<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlow - Preview Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-hover: #272727;
            --text-main: #ffffff;
            --text-secondary: #aaaaaa;
            --accent-color: #cc0000;
            --scrollbar-thumb: #717171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Roboto', sans-serif; overflow-x: hidden; }

        /* --- LAYOUT --- */
        header {
            position: fixed; top: 0; width: 100%; height: 56px; background: #0f0f0f;
            display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 100;
        }
        .logo { font-size: 1.2rem; font-weight: 700; color: white; cursor: pointer; }
        
        .main-container { margin-top: 70px; padding: 24px; max-width: 1600px; margin-left: auto; margin-right: auto; }
        
        /* --- GRID --- */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px 16px;
        }

        /* --- VIDEO CARD & PREVIEW LOGIC --- */
        .video-card { cursor: pointer; display: flex; flex-direction: column; gap: 10px; }

        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 */
            border-radius: 12px;
            overflow: hidden;
            background: #181818;
        }

        /* The static image */
        .thumb-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; transition: opacity 0.3s ease;
            z-index: 1;
        }

        /* The hover video */
        .preview-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 2;
            opacity: 0; transition: opacity 0.3s ease;
            pointer-events: none; /* Prevent clicking video directly */
        }

        /* Active state for preview */
        .thumbnail-wrapper.playing .thumb-img { opacity: 0; }
        .thumbnail-wrapper.playing .preview-video { opacity: 1; }

        .card-meta { padding: 0 4px; }
        .video-title { font-size: 16px; font-weight: 500; color: white; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-stats { font-size: 14px; color: var(--text-secondary); }

        /* --- CUSTOM MODAL PLAYER --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }

        .player-container {
            width: 90%; max-width: 1200px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
        }

        /* Custom Video Element Styling */
        video.main-player {
            width: 100%;
            max-height: 80vh;
            display: block;
            outline: none;
        }

        /* Custom Overlay Controls look (Native controls are used, but we style the container) */
        .player-info-bar {
            background: #000;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .player-controls { display: flex; gap: 15px; }
        .btn-action {
            background: #333; color: white; border: none;
            padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 500;
        }
        .btn-action:hover { background: #444; }

        .close-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }

        /* Loading Spinner */
        .loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 4px solid #333; border-top: 4px solid var(--accent-color);
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; display: none; z-index: 5;
        }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

    </style>
</head>
<body>

    <header>
        <div class="logo">StreamFlow <span style="color:var(--accent-color)">PRO</span></div>
        <div style="font-size: 14px; color: #888;">Hover for Preview • Click to Play</div>
    </header>

    <main class="main-container">
        <h2 style="margin-bottom: 20px;">Trending Now</h2>
        <div class="video-grid" id="videoGrid">
            <!-- Grid generated by JS -->
        </div>
    </main>

    <!-- Modal Player -->
    <div class="modal-overlay" id="videoModal">
        <div class="player-container">
            <button class="close-btn" id="closeModal" style="position:absolute; top: 15px; right: 15px; z-index: 10;">✕</button>
            
            <div style="position:relative; width:100%; background:black;">
                <div class="loader" id="playerLoader"></div>
                <!-- The Main Player -->
                <video id="mainVideo" class="main-player" controls playsinline 
                       controlsList="nodownload" oncontextmenu="return false;">
                    Your browser does not support the video tag.
                </video>
            </div>

            <div class="player-info-bar">
                <div>
                    <h3 id="modalTitle" style="color:white; margin-bottom:5px;">Video Title</h3>
                    <span id="modalStats" style="color:#888; font-size:14px;">Stats</span>
                </div>
                <div class="player-controls">
                    <button class="btn-action" onclick="toggleLike()">👍 Like</button>
                    <button class="btn-action">📥 Share</button> <!-- Visual only, no download -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- MOCK DATA (Simulating API) ---
        // Using reliable sample videos for demo purposes
        const SAMPLE_VIDEO_MP4 = "https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4";
        // A different clip for preview to show they can be different
        const SAMPLE_PREVIEW_MP4 = "https://test-videos.co.uk/vids/jellyfish/mp4/h264/360/Jellyfish_360_10s_1MB.mp4"; 

        const videoData = [
            { id: 1, title: "Big Buck Bunny", views: "1.2M views", date: "2 days ago", thumb: "https://picsum.photos/seed/bunny/600/338", src: SAMPLE_VIDEO_MP4, preview: SAMPLE_PREVIEW_MP4 },
            { id: 2, title: "Cyberpunk City", views: "850K views", date: "5 days ago", thumb: "https://picsum.photos/seed/cyber/600/338", src: SAMPLE_VIDEO_MP4, preview: SAMPLE_PREVIEW_MP4 },
            { id: 3, title: "Mountain Highs", views: "2.4M views", date: "1 week ago", thumb: "https://picsum.photos/seed/mount/600/338", src: SAMPLE_VIDEO_MP4, preview: SAMPLE_PREVIEW_MP4 },
            { id: 4, title: "Ocean Depths", views: "500K views", date: "3 weeks ago", thumb: "https://picsum.photos/seed/ocean/600/338", src: SAMPLE_VIDEO_MP4, preview: SAMPLE_PREVIEW_MP4 },
            { id: 5, title: "Abstract Flow", views: "90K views", date: "1 month ago", thumb: "https://picsum.photos/seed/abstract/600/338", src: SAMPLE_VIDEO_MP4, preview: SAMPLE_PREVIEW_MP4 },
            { id: 6, title: "Urban Life", views: "3.1M views", date: "1 month ago", thumb: "https://picsum.photos/seed/urban/600/338", src: SAMPLE_VIDEO_MP4, preview: SAMPLE_PREVIEW_MP4 },
            { id: 7, title: "Space Travel", views: "4M views", date: "2 months ago", thumb: "https://picsum.photos/seed/space/600/338", src: SAMPLE_VIDEO_MP4, preview: SAMPLE_PREVIEW_MP4 },
            { id: 8, title: "Forest Rain", views: "120K views", date: "2 months ago", thumb: "https://picsum.photos/seed/forest/600/338", src: SAMPLE_VIDEO_MP4, preview: SAMPLE_PREVIEW_MP4 }
        ];

        // --- DOM ELEMENTS ---
        const grid = document.getElementById('videoGrid');
        const modal = document.getElementById('videoModal');
        const closeModal = document.getElementById('closeModal');
        const mainVideo = document.getElementById('mainVideo');
        const modalTitle = document.getElementById('modalTitle');
        const modalStats = document.getElementById('modalStats');
        const playerLoader = document.getElementById('playerLoader');

        // --- INIT GRID ---
        function initGrid() {
            videoData.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                
                // Construct HTML
                card.innerHTML = `
                    <div class="thumbnail-wrapper" id="wrap-${video.id}">
                        <img src="${video.thumb}" class="thumb-img" alt="${video.title}">
                        <video class="preview-video" muted loop playsinline preload="none"></video>
                    </div>
                    <div class="card-meta">
                        <div class="video-title">${video.title}</div>
                        <div class="video-stats">${video.views} • ${video.date}</div>
                    </div>
                `;

                // --- HOVER PREVIEW LOGIC ---
                const wrapper = card.querySelector('.thumbnail-wrapper');
                const previewVid = card.querySelector('video');
                let hoverTimeout;

                card.addEventListener('mouseenter', () => {
                    // Delay to avoid flashing on fast scroll
                    hoverTimeout = setTimeout(() => {
                        wrapper.classList.add('playing');
                        previewVid.src = video.preview;
                        // Browser policy: Must be muted to autoplay
                        previewVid.play().catch(e => console.log("Autoplay blocked:", e));
                    }, 200);
                });

                card.addEventListener('mouseleave', () => {
                    clearTimeout(hoverTimeout);
                    wrapper.classList.remove('playing');
                    previewVid.pause();
                    previewVid.currentTime = 0;
                    // Optional: Remove src to stop buffering
                    // previewVid.src = ""; 
                });

                // --- CLICK TO OPEN PLAYER ---
                card.addEventListener('click', () => openPlayer(video));

                grid.appendChild(card);
            });
        }

        // --- PLAYER LOGIC ---
        function openPlayer(video) {
            modal.classList.add('active');
            playerLoader.style.display = 'block';
            modalTitle.innerText = video.title;
            modalStats.innerText = `${video.views} • ${video.date}`;
            
            mainVideo.src = video.src;
            mainVideo.load(); // Reload to ensure fresh play
            
            // Play when metadata loads
            mainVideo.onloadeddata = () => {
                playerLoader.style.display = 'none';
                mainVideo.play().catch(e => console.log("Play interaction needed"));
            };
        }

        function closePlayer() {
            modal.classList.remove('active');
            mainVideo.pause();
            mainVideo.src = ""; // Stop buffering
        }

        function toggleLike() {
            alert("Added to Liked Videos!");
        }

        // --- EVENTS ---
        closeModal.addEventListener('click', closePlayer);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closePlayer();
        });

        // Initialize
        initGrid();

    </script>
</body>
</html>
